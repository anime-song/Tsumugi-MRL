<text x="390" y="753" font-size="12" font-weight="650" fill="#1c1f24">Train symbolic teacher</text>
<text x="390" y="768" font-size="10.5" fill="#63676e">frame reconstruction + RVQ</text>
<path d="M 610 756 L 636 756" fill="none" stroke="#6b7078" stroke-width="1.6" marker-end="url(#a)"/>
