<text x="884" y="240" class="tag" fill="#b3603a" text-anchor="middle">stop-gradient</text>
<text x="860" y="540" class="tag" fill="#3c8560" text-anchor="middle">stop-gradient (its projection stays trainable)</text>
<text x="496" y="486" class="tag" fill="#2f6ba8" text-anchor="middle">padded frames are excluded from attention, pooling, and losses</text>
<rect x="36" y="730" width="1248" height="52" rx="10" fill="#fafafa" stroke="#e1e2e5"/>
<circle cx="74" cy="756" r="11" fill="#2f6ba8"/>
<text x="74" y="760" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">1</text>
<text x="94" y="753" font-size="12" font-weight="650" fill="#1c1f24">Train Mel-RVQ</text>
<text x="94" y="768" font-size="10.5" fill="#63676e">acoustic teacher</text>
<path d="M 314 756 L 340 756" fill="none" stroke="#6b7078" stroke-width="1.6" marker-end="url(#a)"/>
<circle cx="370" cy="756" r="11" fill="#2f6ba8"/>
