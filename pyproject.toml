[project]
name = "tsumugi-mrl"
version = "0.1.0"
description = "Masked music representation learning with musical teachers."
requires-python = ">=3.10,<3.15"
dependencies = [
    "einops>=0.8",
    "huggingface-hub>=0.25",
    "safetensors>=0.4.3",
    "torch==2.13.0",
    "torchaudio==2.11.0",
]

[project.optional-dependencies]
probe = [
    "numpy>=1.26,<3",
    "soundfile>=0.13",
]
train = [
    "dlchordx>=1.0.5",
    "mido>=1.3.3",
    "numpy>=1.26,<3",
    "soundfile>=0.13",
    "wandb>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
